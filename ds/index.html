<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sysbin Animation Editor</title>
    <style>
        /* ---------------------------------------------
           全局重置 & 深色 AE 主题配色
        --------------------------------------------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* 避免拖拽时选中文字 */
        }

        body {
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            font-size: 13px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部菜单栏 */
        .menu-bar {
            background-color: #252526;
            border-bottom: 1px solid #3c3c3c;
            padding: 4px 12px;
            display: flex;
            gap: 20px;
            flex-shrink: 0;
            height: 32px;
            align-items: center;
        }

        .menu-bar span {
            color: #cccccc;
            cursor: default;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 3px;
        }

        .menu-bar span:hover {
            background-color: #2a2d2e;
        }

        /* 主工作区：左侧面板 + 中间画布 + 底部时间轴 (flex 列) */
        .app {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0; /* flex 溢出处理 */
        }

        /* 中间区域：项目面板 + 画布 */
        .middle-area {
            display: flex;
            flex: 1;
            min-height: 0;
            border-bottom: 1px solid #3c3c3c;
        }

        /* 左侧面板 (项目 + 属性检查器) */
        .left-panel {
            width: 240px;
            background-color: #252526;
            border-right: 1px solid #3c3c3c;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .panel-section {
            padding: 12px 10px;
            border-bottom: 1px solid #3c3c3c;
        }

        .panel-title {
            color: #bbbbbb;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        /* 图层列表 (项目面板) */
        .layer-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .layer-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            background-color: #2d2d2d;
            border-radius: 4px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: background 0.1s;
        }

        .layer-item.active {
            background-color: #2a2d2e;
            border-left-color: #007acc;
        }

        .layer-item:hover {
            background-color: #333;
        }

        .layer-icon {
            width: 16px;
            height: 16px;
            border-radius: 2px;
            background-color: #007acc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
        }

        .layer-icon.text {
            background-color: #e5c07b;
            color: #1e1e1e;
        }

        .layer-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 属性检查器 */
        .prop-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .prop-row label {
            color: #aaaaaa;
            font-size: 12px;
        }

        .prop-row input {
            width: 70px;
            background-color: #1e1e1e;
            border: 1px solid #3c3c3c;
            color: #d4d4d4;
            padding: 4px 6px;
            border-radius: 3px;
            font-size: 12px;
            outline: none;
            text-align: right;
        }

        .prop-row input:focus {
            border-color: #007acc;
        }

        /* 画布视口区域 */
        .canvas-viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1e1e1e;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        .canvas-wrapper {
            background-color: #2a2a2a;
            box-shadow: 0 0 0 1px #3c3c3c, 0 4px 20px rgba(0,0,0,0.5);
            position: relative;
            /* 透明网格背景由 canvas 自身绘制 */
        }

        canvas#viewportCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
            background-color: #333; /* 实际透明网格在绘制时覆盖 */
        }

        canvas#viewportCanvas:active {
            cursor: grabbing;
        }

        /* 底部时间轴区域 */
        .timeline-panel {
            height: 220px;
            background-color: #252526;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        /* 时间轴工具栏 (播放控制) */
        .timeline-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            border-bottom: 1px solid #3c3c3c;
            background-color: #2d2d2d;
        }

        .toolbar-btn {
            background-color: #3c3c3c;
            border: none;
            color: #d4d4d4;
            padding: 5px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.1s;
        }

        .toolbar-btn:hover {
            background-color: #4a4a4a;
        }

        .toolbar-btn.primary {
            background-color: #007acc;
        }

        .toolbar-btn.primary:hover {
            background-color: #1e8ad6;
        }

        .time-display {
            font-family: 'Consolas', monospace;
            background-color: #1e1e1e;
            padding: 4px 10px;
            border-radius: 3px;
            color: #e5c07b;
            font-size: 13px;
        }

        /* 时间轴主体：左侧图层列表 + 右侧轨道 */
        .timeline-body {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        /* 左侧图层列表 (时间轴) */
        .timeline-layers {
            width: 200px;
            background-color: #252526;
            border-right: 1px solid #3c3c3c;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .timeline-layer-header {
            height: 40px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            border-bottom: 1px solid #3c3c3c;
            background-color: #2d2d2d;
            font-size: 12px;
            color: #bbbbbb;
        }

        .timeline-layer-item {
            height: 40px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            border-bottom: 1px solid #2d2d2d;
            cursor: pointer;
            gap: 8px;
            font-size: 12px;
            transition: background 0.1s;
        }

        .timeline-layer-item.active {
            background-color: #2a2d2e;
            border-left: 3px solid #007acc;
        }

        .timeline-layer-item:hover {
            background-color: #333;
        }

        /* 右侧轨道区域 */
        .tracks-area {
            flex: 1;
            overflow-x: auto;
            overflow-y: auto;
            position: relative;
            background-color: #1e1e1e;
        }

        .tracks-container {
            position: relative;
            min-width: 100%;
            height: 100%;
        }

        /* 时间标尺 (固定在顶部) */
        .time-ruler {
            height: 28px;
            background-color: #2d2d2d;
            border-bottom: 1px solid #3c3c3c;
            position: relative;
            display: flex;
            font-size: 10px;
            color: #888;
        }

        .ruler-tick {
            position: absolute;
            bottom: 0;
            width: 1px;
            height: 6px;
            background-color: #666;
        }

        .ruler-label {
            position: absolute;
            top: 2px;
            transform: translateX(-50%);
            font-size: 9px;
            color: #888;
        }

        /* 轨道行容器 */
        .track-rows {
            position: relative;
        }

        .track-row {
            height: 40px;
            border-bottom: 1px solid #2d2d2d;
            position: relative;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .track-row.active {
            background-color: #2a2d2e;
        }

        /* 关键帧菱形 */
        .keyframe {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #e5c07b;
            transform: translate(-50%, -50%) rotate(45deg);
            top: 50%;
            cursor: pointer;
            border: 1px solid #b8953a;
            border-radius: 2px;
            transition: background 0.1s;
            z-index: 10;
        }

        .keyframe:hover {
            background-color: #ffd966;
            transform: translate(-50%, -50%) rotate(45deg) scale(1.2);
        }

        .keyframe.selected {
            background-color: #ffffff;
            border-color: #007acc;
        }

        /* 播放头 */
        .playhead {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #e74c3c;
            z-index: 100;
            cursor: ew-resize;
            pointer-events: none; /* 让上层元素能接收事件，播放头本身通过单独层处理 */
        }

        .playhead-handle {
            position: absolute;
            top: -6px;
            left: -6px;
            width: 14px;
            height: 14px;
            background-color: #e74c3c;
            transform: rotate(45deg);
            border-radius: 2px;
            cursor: ew-resize;
            pointer-events: auto;
            z-index: 101;
        }

        /* 可拖动播放头覆盖层 (覆盖整个轨道区域) */
        .playhead-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .playhead-overlay .playhead-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #e74c3c;
            pointer-events: none;
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        ::-webkit-scrollbar-thumb {
            background: #3c3c3c;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* 响应式调整 */
        @media (max-width: 900px) {
            .left-panel {
                width: 180px;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部菜单栏 -->
    <div class="menu-bar">
        <span>File</span>
        <span>Edit</span>
        <span>Composition</span>
        <span>Layer</span>
        <span>Animation</span>
        <span>View</span>
        <span>Window</span>
        <span>Help</span>
    </div>

    <!-- 应用主体 -->
    <div class="app">
        <!-- 中间区域：左侧面板 + 画布 -->
        <div class="middle-area">
            <!-- 左侧面板 -->
            <div class="left-panel">
                <div class="panel-section">
                    <div class="panel-title">Project</div>
                    <div class="layer-list" id="layerList">
                        <!-- 动态生成图层列表 -->
                    </div>
                </div>
                <div class="panel-section">
                    <div class="panel-title">Transform</div>
                    <div class="prop-row">
                        <label>Position X</label>
                        <input type="number" id="propPosX" value="100">
                    </div>
                    <div class="prop-row">
                        <label>Position Y</label>
                        <input type="number" id="propPosY" value="100">
                    </div>
                    <div class="prop-row">
                        <label>Scale</label>
                        <input type="number" id="propScale" value="1" step="0.1">
                    </div>
                    <div class="prop-row">
                        <label>Rotation</label>
                        <input type="number" id="propRotation" value="0">
                    </div>
                    <div class="prop-row">
                        <label>Opacity</label>
                        <input type="number" id="propOpacity" value="100" min="0" max="100">
                    </div>
                </div>
            </div>

            <!-- 画布视口 -->
            <div class="canvas-viewport" id="canvasViewport">
                <div class="canvas-wrapper" id="canvasWrapper">
                    <canvas id="viewportCanvas" width="640" height="360"></canvas>
                </div>
            </div>
        </div>

        <!-- 底部时间轴 -->
        <div class="timeline-panel">
            <div class="timeline-toolbar">
                <button class="toolbar-btn primary" id="playBtn">▶ Play</button>
                <button class="toolbar-btn" id="pauseBtn">⏸ Pause</button>
                <button class="toolbar-btn" id="exportBtn">⬇ Export WebM</button>
                <div class="time-display" id="timeDisplay">00:00:00 / 00:10:00</div>
                <div style="flex:1"></div>
                <button class="toolbar-btn" id="addLayerBtn">+ Add Shape</button>
                <button class="toolbar-btn" id="addTextLayerBtn">+ Add Text</button>
            </div>
            <div class="timeline-body">
                <div class="timeline-layers" id="timelineLayerList">
                    <div class="timeline-layer-header">Layers</div>
                    <!-- 动态生成时间轴图层 -->
                </div>
                <div class="tracks-area" id="tracksArea">
                    <div class="tracks-container" id="tracksContainer">
                        <!-- 时间标尺 -->
                        <div class="time-ruler" id="timeRuler"></div>
                        <!-- 轨道行容器 -->
                        <div class="track-rows" id="trackRows"></div>
                        <!-- 播放头覆盖层 -->
                        <div class="playhead-overlay" id="playheadOverlay">
                            <div class="playhead-line" id="playheadLine" style="left:0px"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. 工具函数 & 全局配置
        // ============================================================
        const FPS = 30;                     // 帧率
        const DURATION = 10;                // 总时长（秒）
        const TOTAL_FRAMES = DURATION * FPS;
        const CANVAS_W = 640;               // 画布宽
        const CANVAS_H = 360;               // 画布高
        const TRACK_LEFT_MARGIN = 20;       // 轨道左边距（用于时间标尺对齐）

        // 当前状态
        let currentFrame = 0;               // 当前帧数
        let isPlaying = false;
        let animationFrameId = null;
        let lastTimestamp = 0;
        let playbackSpeed = 1.0;

        // 图层数据
        let layers = [];                    // 所有图层对象
        let activeLayerIndex = -1;          // 当前选中的图层索引
        let selectedKeyframe = null;        // { layerId, property, frame } 用于高亮

        // DOM 元素引用
        const canvas = document.getElementById('viewportCanvas');
        const ctx = canvas.getContext('2d');
        const layerListEl = document.getElementById('layerList');
        const timelineLayerListEl = document.getElementById('timelineLayerList');
        const trackRowsEl = document.getElementById('trackRows');
        const timeRulerEl = document.getElementById('timeRuler');
        const playheadLineEl = document.getElementById('playheadLine');
        const timeDisplayEl = document.getElementById('timeDisplay');
        const propPosX = document.getElementById('propPosX');
        const propPosY = document.getElementById('propPosY');
        const propScale = document.getElementById('propScale');
        const propRotation = document.getElementById('propRotation');
        const propOpacity = document.getElementById('propOpacity');

        // ============================================================
        // 2. KeyframeManager 类 —— 关键帧管理与插值引擎
        // ============================================================
        class KeyframeManager {
            constructor() {
                // 数据结构: { layerId: { property: [ { frame, value } ] } }
                this.store = {};
            }

            /**
             * 添加/更新关键帧
             * @param {string} layerId - 图层ID
             * @param {string} property - 属性名 (x, y, scale, rotation, opacity)
             * @param {number} frame - 帧数
             * @param {number} value - 属性值
             */
            addKeyframe(layerId, property, frame, value) {
                if (!this.store[layerId]) this.store[layerId] = {};
                if (!this.store[layerId][property]) this.store[layerId][property] = [];

                const keys = this.store[layerId][property];
                // 查找是否已存在同一帧的关键帧，有则更新
                const existing = keys.find(k => k.frame === frame);
                if (existing) {
                    existing.value = value;
                } else {
                    keys.push({ frame, value });
                    // 按帧排序，便于后续插值查找
                    keys.sort((a, b) => a.frame - b.frame);
                }
            }

            /**
             * 删除关键帧
             */
            removeKeyframe(layerId, property, frame) {
                if (!this.store[layerId] || !this.store[layerId][property]) return;
                const keys = this.store[layerId][property];
                const idx = keys.findIndex(k => k.frame === frame);
                if (idx !== -1) keys.splice(idx, 1);
            }

            /**
             * 获取某个图层属性的所有关键帧
             */
            getKeyframes(layerId, property) {
                if (!this.store[layerId] || !this.store[layerId][property]) return [];
                return this.store[layerId][property];
            }

            /**
             * 核心：线性插值计算属性值
             * @param {string} layerId
             * @param {string} property
             * @param {number} frame - 当前帧
             * @param {number} defaultValue - 如果没有关键帧，返回的默认值
             * @returns {number} 插值后的属性值
             */
            getValue(layerId, property, frame, defaultValue) {
                const keys = this.getKeyframes(layerId, property);
                if (keys.length === 0) return defaultValue;
                if (keys.length === 1) return keys[0].value;

                // 如果当前帧在第一个关键帧之前，返回第一个关键帧的值
                if (frame <= keys[0].frame) return keys[0].value;
                // 如果当前帧在最后一个关键帧之后，返回最后一个关键帧的值
                if (frame >= keys[keys.length - 1].frame) return keys[keys.length - 1].value;

                // 找到当前帧所在区间 [k0, k1]
                let k0 = keys[0];
                let k1 = keys[1];
                for (let i = 0; i < keys.length - 1; i++) {
                    if (frame >= keys[i].frame && frame <= keys[i + 1].frame) {
                        k0 = keys[i];
                        k1 = keys[i + 1];
                        break;
                    }
                }

                // 线性插值公式: value = v0 + (v1 - v0) * (frame - f0) / (f1 - f0)
                const t = (frame - k0.frame) / (k1.frame - k0.frame);
                return k0.value + (k1.value - k0.value) * t;
            }
        }

        // 实例化全局关键帧管理器
        const kfManager = new KeyframeManager();

        // ============================================================
        // 3. 图层类与图层管理
        // ============================================================
        class Layer {
            constructor(config) {
                this.id = 'layer_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                this.name = config.name || 'Layer';
                this.type = config.type || 'shape'; // 'shape' | 'text'
                this.color = config.color || '#4A90D9';
                this.text = config.text || 'Text';
                this.fontSize = config.fontSize || 24;
                this.visible = true;

                // 默认属性值（关键帧不存在时使用）
                this.defaults = {
                    x: config.x !== undefined ? config.x : 100,
                    y: config.y !== undefined ? config.y : 100,
                    scale: 1,
                    rotation: 0,
                    opacity: 1.0,
                };

                // 初始化一些关键帧，让初始状态可见
                // 注意：首次添加图层时，在帧0处设置关键帧，这样可以直接动画
                // 但我们不在构造函数里加，由外部负责初始化
            }

            // 获取当前帧的插值属性
            getPropsAtFrame(frame) {
                return {
                    x: kfManager.getValue(this.id, 'x', frame, this.defaults.x),
                    y: kfManager.getValue(this.id, 'y', frame, this.defaults.y),
                    scale: kfManager.getValue(this.id, 'scale', frame, this.defaults.scale),
                    rotation: kfManager.getValue(this.id, 'rotation', frame, this.defaults.rotation),
                    opacity: kfManager.getValue(this.id, 'opacity', frame, this.defaults.opacity),
                };
            }
        }

        // 添加新图层
        function addLayer(type = 'shape', name = null) {
            const colors = ['#4A90D9', '#E67E22', '#2ECC71', '#E74C3C', '#9B59B6', '#1ABC9C'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            const layer = new Layer({
                name: name || (type === 'text' ? 'Text Layer' : 'Shape Layer'),
                type: type,
                color: randomColor,
                x: 200 + Math.random() * 200,
                y: 100 + Math.random() * 150,
                text: 'Sample',
                fontSize: 32,
            });

            // 初始化关键帧：在帧0设置初始属性，这样可以直接拖拽生成动画
            const initProps = {
                x: layer.defaults.x,
                y: layer.defaults.y,
                scale: layer.defaults.scale,
                rotation: layer.defaults.rotation,
                opacity: layer.defaults.opacity,
            };
            for (const [prop, val] of Object.entries(initProps)) {
                kfManager.addKeyframe(layer.id, prop, 0, val);
            }

            // 添加第二个关键帧让动画有变化（可选，为了演示效果，在100帧处稍作变化）
            // 为了不干扰用户创作，不自动添加第二个关键帧，而是保持初始状态
            // 但为了让用户看到效果，可以在第60帧处添加一个轻微的变化
            // 这里我们为了演示，不加额外关键帧，让用户自己添加

            layers.push(layer);
            activeLayerIndex = layers.length - 1;
            refreshAllUI();
            draw();
            return layer;
        }

        // 删除当前图层
        function deleteActiveLayer() {
            if (activeLayerIndex >= 0 && activeLayerIndex < layers.length) {
                layers.splice(activeLayerIndex, 1);
                activeLayerIndex = Math.min(activeLayerIndex, layers.length - 1);
                refreshAllUI();
                draw();
            }
        }

        // ============================================================
        // 4. 渲染循环 & 绘制逻辑
        // ============================================================
        function drawTransparentGrid() {
            const w = CANVAS_W;
            const h = CANVAS_H;
            // 绘制灰色背景 (模拟透明)
            ctx.fillStyle = '#3a3a3a';
            ctx.fillRect(0, 0, w, h);

            // 绘制棋盘格
            const gridSize = 16;
            ctx.fillStyle = '#4a4a4a';
            for (let y = 0; y < h; y += gridSize) {
                for (let x = 0; x < w; x += gridSize) {
                    if ((Math.floor(x / gridSize) + Math.floor(y / gridSize)) % 2 === 0) {
                        ctx.fillRect(x, y, gridSize, gridSize);
                    }
                }
            }
        }

        /**
         * 核心渲染函数：根据当前帧计算所有图层的插值属性并绘制
         */
        function draw() {
            // 清空画布并绘制透明网格
            drawTransparentGrid();

            // 遍历所有图层，绘制
            for (const layer of layers) {
                if (!layer.visible) continue;

                const props = layer.getPropsAtFrame(currentFrame);

                ctx.save();

                // 应用透明度
                ctx.globalAlpha = props.opacity;

                // 应用变换：平移 -> 旋转 -> 缩放
                ctx.translate(props.x, props.y);
                ctx.rotate(props.rotation * Math.PI / 180);
                ctx.scale(props.scale, props.scale);

                if (layer.type === 'shape') {
                    // 绘制一个居中的矩形 (以原点为中心)
                    const size = 60;
                    ctx.fillStyle = layer.color;
                    ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    ctx.shadowBlur = 8;
                    ctx.fillRect(-size / 2, -size / 2, size, size);
                    ctx.shadowBlur = 0; // 重置阴影

                    // 绘制边框
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(-size / 2, -size / 2, size, size);
                } else if (layer.type === 'text') {
                    // 绘制文本
                    ctx.fillStyle = layer.color;
                    ctx.font = `bold ${layer.fontSize}px 'Segoe UI', sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    ctx.shadowBlur = 8;
                    ctx.fillText(layer.text, 0, 0);
                    ctx.shadowBlur = 0;
                }

                ctx.restore();
            }

            // 更新播放头位置和时间显示
            updatePlayheadPosition();
            updateTimeDisplay();
        }

        // 更新播放头位置（在时间轴上）
        function updatePlayheadPosition() {
            const totalWidth = getTrackContentWidth();
            const x = (currentFrame / TOTAL_FRAMES) * totalWidth;
            playheadLineEl.style.left = x + 'px';
        }

        // 获取轨道内容总宽度（需要与标尺宽度一致）
        function getTrackContentWidth() {
            // 让轨道总宽度等于可见区域的宽度，但至少为 800px
            const area = document.getElementById('tracksArea');
            const minWidth = 800;
            return Math.max(area.clientWidth - 20, minWidth);
        }

        function updateTimeDisplay() {
            const curSec = Math.floor(currentFrame / FPS);
            const curFrame = currentFrame % FPS;
            const totalSec = DURATION;
            timeDisplayEl.textContent = 
                `00:${String(curSec).padStart(2, '0')}:${String(curFrame).padStart(2, '0')} / 00:${String(totalSec).padStart(2, '0')}:00`;
        }

        // ============================================================
        // 5. 播放控制
        // ============================================================
        function play() {
            if (isPlaying) return;
            isPlaying = true;
            lastTimestamp = performance.now();
            animationFrameId = requestAnimationFrame(playbackLoop);
        }

        function pause() {
            isPlaying = false;
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }
        }

        function playbackLoop(timestamp) {
            if (!isPlaying) return;

            const delta = (timestamp - lastTimestamp) / 1000; // 秒
            lastTimestamp = timestamp;

            // 计算推进的帧数
            const frameDelta = delta * FPS * playbackSpeed;
            currentFrame = (currentFrame + frameDelta) % TOTAL_FRAMES;

            // 如果超过总帧数则循环（取模）

            // 更新UI
            draw();
            refreshTrackKeyframes(); // 关键帧位置需要跟随时间标尺

            animationFrameId = requestAnimationFrame(playbackLoop);
        }

        // ============================================================
        // 6. UI 刷新：图层列表、时间轴、属性面板
        // ============================================================
        function refreshAllUI() {
            refreshLayerList();
            refreshTimelineLayers();
            refreshTrackKeyframes();
            refreshPropertyPanel();
            // 重绘时间标尺（宽度可能变化）
            drawTimeRuler();
            updatePlayheadPosition();
            draw();
        }

        // 刷新左侧项目面板图层列表
        function refreshLayerList() {
            layerListEl.innerHTML = '';
            layers.forEach((layer, idx) => {
                const item = document.createElement('div');
                item.className = `layer-item ${idx === activeLayerIndex ? 'active' : ''}`;
                item.innerHTML = `
                    <div class="layer-icon ${layer.type === 'text' ? 'text' : ''}">${layer.type === 'text' ? 'T' : '■'}</div>
                    <div class="layer-name">${layer.name}</div>
                `;
                item.addEventListener('click', () => {
                    activeLayerIndex = idx;
                    refreshAllUI();
                });
                layerListEl.appendChild(item);
            });
        }

        // 刷新时间轴左侧图层列表
        function refreshTimelineLayers() {
            // 保留 header，删除其他
            const header = timelineLayerListEl.querySelector('.timeline-layer-header');
            timelineLayerListEl.innerHTML = '';
            if (header) timelineLayerListEl.appendChild(header);
            else {
                const h = document.createElement('div');
                h.className = 'timeline-layer-header';
                h.textContent = 'Layers';
                timelineLayerListEl.appendChild(h);
            }

            layers.forEach((layer, idx) => {
                const item = document.createElement('div');
                item.className = `timeline-layer-item ${idx === activeLayerIndex ? 'active' : ''}`;
                item.innerHTML = `
                    <span>${layer.type === 'text' ? 'T' : '■'}</span>
                    <span>${layer.name}</span>
                `;
                item.addEventListener('click', () => {
                    activeLayerIndex = idx;
                    refreshAllUI();
                });
                timelineLayerListEl.appendChild(item);
            });
        }

        // 绘制时间标尺
        function drawTimeRuler() {
            const width = getTrackContentWidth();
            timeRulerEl.style.width = width + 'px';
            timeRulerEl.innerHTML = '';

            // 每 30 帧（1秒）一个大刻度，每 10 帧一个小刻度
            const stepLarge = 30; // 1秒
            const stepSmall = 10;
            for (let f = 0; f <= TOTAL_FRAMES; f += stepSmall) {
                const x = (f / TOTAL_FRAMES) * width;
                const tick = document.createElement('div');
                tick.className = 'ruler-tick';
                tick.style.left = x + 'px';
                if (f % stepLarge === 0) {
                    tick.style.height = '10px';
                    tick.style.backgroundColor = '#aaa';
                    // 添加标签
                    const label = document.createElement('div');
                    label.className = 'ruler-label';
                    label.style.left = x + 'px';
                    label.textContent = (f / FPS).toFixed(1) + 's';
                    timeRulerEl.appendChild(label);
                }
                timeRulerEl.appendChild(tick);
            }
        }

        // 刷新轨道行与关键帧
        function refreshTrackKeyframes() {
            const width = getTrackContentWidth();
            trackRowsEl.style.width = width + 'px';
            trackRowsEl.innerHTML = '';

            // 为每个图层创建一行
            layers.forEach((layer, idx) => {
                const row = document.createElement('div');
                row.className = `track-row ${idx === activeLayerIndex ? 'active' : ''}`;
                row.dataset.layerIndex = idx;
                row.dataset.layerId = layer.id;

                // 点击行切换选中
                row.addEventListener('click', (e) => {
                    if (e.target.classList.contains('keyframe')) return; // 点击关键帧不切换
                    activeLayerIndex = idx;
                    refreshAllUI();
                });

                // 绘制该图层所有关键帧（所有属性共用轨道，但用不同位置表示）
                // 为了简化，我们将所有属性的关键帧都显示在同一行，但位置重叠
                // 我们只显示 x, y, scale, rotation, opacity 的关键帧（去重帧位置）
                const frameSet = new Set();
                ['x', 'y', 'scale', 'rotation', 'opacity'].forEach(prop => {
                    const keys = kfManager.getKeyframes(layer.id, prop);
                    keys.forEach(k => frameSet.add(k.frame));
                });

                // 为每个帧创建菱形
                frameSet.forEach(frame => {
                    const left = (frame / TOTAL_FRAMES) * width;
                    const kf = document.createElement('div');
                    kf.className = 'keyframe';
                    kf.style.left = left + 'px';
                    kf.dataset.frame = frame;
                    kf.dataset.layerId = layer.id;

                    // 检查是否选中
                    if (selectedKeyframe && selectedKeyframe.layerId === layer.id && selectedKeyframe.frame === frame) {
                        kf.classList.add('selected');
                    }

                    // 点击关键帧选中并高亮
                    kf.addEventListener('click', (e) => {
                        e.stopPropagation();
                        selectedKeyframe = { layerId: layer.id, frame };
                        // 跳转到该帧
                        currentFrame = frame;
                        refreshTrackKeyframes();
                        updatePlayheadPosition();
                        draw();
                        refreshPropertyPanel();
                    });

                    // 右键删除关键帧
                    kf.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        if (confirm(`删除帧 ${frame} 上的所有属性关键帧？`)) {
                            ['x', 'y', 'scale', 'rotation', 'opacity'].forEach(prop => {
                                kfManager.removeKeyframe(layer.id, prop, frame);
                            });
                            if (selectedKeyframe && selectedKeyframe.layerId === layer.id && selectedKeyframe.frame === frame) {
                                selectedKeyframe = null;
                            }
                            refreshAllUI();
                        }
                    });

                    row.appendChild(kf);
                });

                trackRowsEl.appendChild(row);
            });
        }

        // 刷新属性面板
        function refreshPropertyPanel() {
            if (activeLayerIndex < 0 || activeLayerIndex >= layers.length) {
                propPosX.value = '';
                propPosY.value = '';
                propScale.value = '';
                propRotation.value = '';
                propOpacity.value = '';
                return;
            }
            const layer = layers[activeLayerIndex];
            const props = layer.getPropsAtFrame(currentFrame);
            propPosX.value = Math.round(props.x);
            propPosY.value = Math.round(props.y);
            propScale.value = props.scale.toFixed(2);
            propRotation.value = Math.round(props.rotation);
            propOpacity.value = Math.round(props.opacity * 100);
        }

        // 从属性面板更新当前图层在当前帧的关键帧
        function updatePropertyFromInput(property, value) {
            if (activeLayerIndex < 0) return;
            const layer = layers[activeLayerIndex];
            let numValue = parseFloat(value);
            if (isNaN(numValue)) return;

            // 特殊处理：透明度范围 0-100 -> 0-1
            if (property === 'opacity') {
                numValue = Math.max(0, Math.min(100, numValue)) / 100;
            }

            // 添加关键帧到当前帧
            kfManager.addKeyframe(layer.id, property, currentFrame, numValue);
            refreshTrackKeyframes();
            draw();
            refreshPropertyPanel();
        }

        // ============================================================
        // 7. 交互：Canvas 拖拽、时间轴播放头拖动
        // ============================================================

        // 画布拖拽移动图层
        let isDraggingCanvas = false;
        let dragStartX = 0, dragStartY = 0;
        let dragStartPropX = 0, dragStartPropY = 0;
        let dragLayer = null;

        canvas.addEventListener('mousedown', (e) => {
            if (activeLayerIndex < 0 || activeLayerIndex >= layers.length) return;
            const layer = layers[activeLayerIndex];
            if (!layer.visible) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;

            const props = layer.getPropsAtFrame(currentFrame);
            // 简单判断是否点击在图层附近（距离中心 80px 内）
            const dx = mouseX - props.x;
            const dy = mouseY - props.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 80) {
                isDraggingCanvas = true;
                dragLayer = layer;
                dragStartX = mouseX;
                dragStartY = mouseY;
                dragStartPropX = props.x;
                dragStartPropY = props.y;
                canvas.style.cursor = 'grabbing';

                // 在拖动开始时，确保当前帧有关键帧，否则拖动结束后添加
                // 但为了让拖动流畅，我们在拖动过程中实时更新关键帧（或者等到mouseup时添加）
                // 这里采用：拖动过程中不修改关键帧，等到mouseup时再添加关键帧
                e.preventDefault();
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDraggingCanvas || !dragLayer) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;

            const dx = mouseX - dragStartX;
            const dy = mouseY - dragStartY;

            const newX = dragStartPropX + dx;
            const newY = dragStartPropY + dy;

            // 实时更新图层默认值并绘制，但不写入关键帧（为了不产生大量关键帧）
            // 我们需要临时修改并重绘，但最终在mouseup时写入关键帧
            // 更好的方式：临时修改defaults，并让getPropsAtFrame返回defaults？但插值会干扰。
            // 所以我们用另一种方法：直接修改当前帧的关键帧（如果存在）或者创建临时对象
            // 为了简化，我们直接在拖动过程中更新关键帧，这样会不断添加/更新当前帧的关键帧
            // 但这会导致每帧都创建关键帧，但仅限当前帧，没有问题！
            // 因为addKeyframe会更新同一帧的关键帧值
            kfManager.addKeyframe(dragLayer.id, 'x', currentFrame, newX);
            kfManager.addKeyframe(dragLayer.id, 'y', currentFrame, newY);

            // 同步更新默认值，以便在没有关键帧的属性上使用
            dragLayer.defaults.x = newX;
            dragLayer.defaults.y = newY;

            draw();
            refreshPropertyPanel();
            refreshTrackKeyframes(); // 关键帧位置可能变化（如果当前帧有关键帧）
        });

        window.addEventListener('mouseup', (e) => {
            if (isDraggingCanvas) {
                isDraggingCanvas = false;
                dragLayer = null;
                canvas.style.cursor = 'grab';
                // 最后再刷新一下，确保关键帧显示
                refreshAllUI();
            }
        });

        // 时间轴播放头拖动
        const tracksArea = document.getElementById('tracksArea');
        let isDraggingPlayhead = false;

        tracksArea.addEventListener('mousedown', (e) => {
            // 如果点击的是关键帧，则不拖动播放头
            if (e.target.classList.contains('keyframe')) return;
            // 计算点击位置对应的帧
            const rect = tracksArea.getBoundingClientRect();
            const x = e.clientX - rect.left + tracksArea.scrollLeft;
            const totalWidth = getTrackContentWidth();
            const frame = Math.round((x / totalWidth) * TOTAL_FRAMES);
            currentFrame = Math.max(0, Math.min(TOTAL_FRAMES, frame));

            isDraggingPlayhead = true;
            updatePlayheadPosition();
            draw();
            refreshPropertyPanel();
            // 刷新关键帧选中状态
            if (selectedKeyframe) {
                selectedKeyframe = null;
                refreshTrackKeyframes();
            }
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDraggingPlayhead) return;

            const rect = tracksArea.getBoundingClientRect();
            let x = e.clientX - rect.left + tracksArea.scrollLeft;
            const totalWidth = getTrackContentWidth();
            // 限制范围
            x = Math.max(0, Math.min(totalWidth, x));
            const frame = Math.round((x / totalWidth) * TOTAL_FRAMES);
            currentFrame = Math.max(0, Math.min(TOTAL_FRAMES, frame));

            updatePlayheadPosition();
            draw();
            refreshPropertyPanel();
        });

        window.addEventListener('mouseup', () => {
            if (isDraggingPlayhead) {
                isDraggingPlayhead = false;
                refreshAllUI(); // 确保关键帧显示同步
            }
        });

        // 监听窗口大小变化，刷新UI
        window.addEventListener('resize', () => {
            refreshAllUI();
        });

        // ============================================================
        // 8. 导出 WebM (MediaRecorder)
        // ============================================================
        function exportWebM() {
            // 暂停播放
            pause();

            // 确保画布是最新状态
            draw();

            // 创建一个离屏canvas来录制？直接录制当前canvas也可以，但要确保录制过程中动画能播放。
            // 但MediaRecorder只能捕获canvas的实时流，我们需要在录制时播放动画。
            // 这里采用简单的思路：录制一段完整播放的动画，然后下载。

            const stream = canvas.captureStream(FPS);
            const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
            const chunks = [];

            recorder.ondataavailable = (e) => {
                if (e.data.size > 0) chunks.push(e.data);
            };

            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'sysbin_animation.webm';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            // 重置到开头并开始播放
            currentFrame = 0;
            draw();
            recorder.start();

            // 开始播放
            let startTime = performance.now();
            function recordLoop(now) {
                const elapsed = (now - startTime) / 1000;
                if (elapsed >= DURATION) {
                    // 结束
                    recorder.stop();
                    currentFrame = 0;
                    draw();
                    updatePlayheadPosition();
                    refreshPropertyPanel();
                    return;
                }

                // 计算当前帧
                currentFrame = (elapsed / DURATION) * TOTAL_FRAMES;
                draw();
                updatePlayheadPosition();

                requestAnimationFrame(recordLoop);
            }
            requestAnimationFrame(recordLoop);
        }

        // ============================================================
        // 9. 初始化 & 事件绑定
        // ============================================================
        function init() {
            // 创建初始图层
            const layer1 = addLayer('shape', 'Shape Layer 1');
            layer1.defaults.x = 200;
            layer1.defaults.y = 160;
            kfManager.addKeyframe(layer1.id, 'x', 0, 200);
            kfManager.addKeyframe(layer1.id, 'y', 0, 160);

            // 添加第二个关键帧形成动画（移动+缩放）
            kfManager.addKeyframe(layer1.id, 'x', 90, 450);
            kfManager.addKeyframe(layer1.id, 'y', 90, 200);
            kfManager.addKeyframe(layer1.id, 'scale', 0, 1);
            kfManager.addKeyframe(layer1.id, 'scale', 90, 1.5);
            kfManager.addKeyframe(layer1.id, 'rotation', 0, 0);
            kfManager.addKeyframe(layer1.id, 'rotation', 90, 45);
            kfManager.addKeyframe(layer1.id, 'opacity', 0, 1);
            kfManager.addKeyframe(layer1.id, 'opacity', 90, 0.6);

            // 添加第二个图层作为文字
            const layer2 = addLayer('text', 'Text Layer 1');
            layer2.text = 'Sysbin';
            layer2.fontSize = 40;
            layer2.defaults.x = 400;
            layer2.defaults.y = 280;
            kfManager.addKeyframe(layer2.id, 'x', 0, 400);
            kfManager.addKeyframe(layer2.id, 'y', 0, 280);
            kfManager.addKeyframe(layer2.id, 'x', 120, 250);
            kfManager.addKeyframe(layer2.id, 'y', 120, 120);
            kfManager.addKeyframe(layer2.id, 'rotation', 0, 0);
            kfManager.addKeyframe(layer2.id, 'rotation', 120, 360);

            // 设置活动图层为第一个
            activeLayerIndex = 0;
            currentFrame = 0;

            // 绑定按钮事件
            document.getElementById('playBtn').addEventListener('click', play);
            document.getElementById('pauseBtn').addEventListener('click', pause);
            document.getElementById('exportBtn').addEventListener('click', exportWebM);
            document.getElementById('addLayerBtn').addEventListener('click', () => addLayer('shape'));
            document.getElementById('addTextLayerBtn').addEventListener('click', () => addLayer('text'));

            // 属性输入框事件
            propPosX.addEventListener('change', (e) => updatePropertyFromInput('x', e.target.value));
            propPosY.addEventListener('change', (e) => updatePropertyFromInput('y', e.target.value));
            propScale.addEventListener('change', (e) => updatePropertyFromInput('scale', e.target.value));
            propRotation.addEventListener('change', (e) => updatePropertyFromInput('rotation', e.target.value));
            propOpacity.addEventListener('change', (e) => updatePropertyFromInput('opacity', e.target.value));

            // 初始化时间标尺和UI
            refreshAllUI();
            drawTimeRuler();
            draw();

            // 设置画布尺寸和wrapper尺寸
            canvas.width = CANVAS_W;
            canvas.height = CANVAS_H;
            const wrapper = document.getElementById('canvasWrapper');
            wrapper.style.width = CANVAS_W + 'px';
            wrapper.style.height = CANVAS_H + 'px';
        }

        // 启动应用
        init();
    </script>
</body>
