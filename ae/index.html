<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sysbin 动画编辑器</title>
    <style>
        /* ============================================
               GLOBAL RESET & DARK THEME
               ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #1e1e1e;
            --bg-panel: #252526;
            --bg-input: #1a1a1c;
            --accent: #007acc;
            --accent-hover: #0098ff;
            --text-primary: #cccccc;
            --text-secondary: #999999;
            --text-dim: #666666;
            --border: #3c3c3c;
            --border-light: #4a4a4a;
            --warning: #dba110;
            --selection: #007acc40;
            --playhead: #ff4444;
            --keyframe: #ffd700;
            --track-even: #2a2a2c;
            --track-odd: #222224;
            --ruler-bg: #1e1e20;
            --scroll-bg: #2a2a2c;
            --font-mono: 'Consolas', 'Courier New', monospace;
            --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        html,
        body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-ui);
            font-size: 12px;
            user-select: none;
            -webkit-user-select: none;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scroll-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
        /* ============================================
               APP LAYOUT (Grid)
               ============================================ */
        #app {
            display: grid;
            grid-template-rows: 28px 1fr 180px;
            grid-template-columns: 240px 1fr 220px;
            grid-template-areas:
                "menu menu menu"
                "left center right"
                "timeline timeline timeline";
            height: 100vh;
            width: 100vw;
            background: var(--bg-primary);
            overflow: hidden;
        }
        /* ============================================
           TOP MENU BAR
           ============================================ */
        #top-menu {
            grid-area: menu;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 6px;
            flex-shrink: 0;
            z-index: 100;
        }
        #top-menu .logo {
            color: var(--accent);
            font-weight: 600;
            font-size: 13px;
            margin-right: 16px;
            letter-spacing: 0.3px;
        }
        #top-menu .logo span {
            color: var(--text-secondary);
            font-weight: 300;
        }
        #top-menu .menu-items {
            display: flex;
            gap: 2px;
            flex: 1;
        }
        #top-menu .menu-items .mi {
            padding: 3px 10px;
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
            transition: background 0.1s;
        }
        #top-menu .menu-items .mi:hover {
            background: #38383a;
            color: var(--text-primary);
        }
        #top-menu .workspace-info {
            color: var(--text-dim);
            font-size: 10px;
            padding: 0 10px;
            border-left: 1px solid var(--border);
            margin-left: auto;
        }
        /* ============================================
           LEFT PANEL (Project & Info)
           ============================================ */
        #left-panel {
            grid-area: left;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }
        .panel-tabs {
            display: flex;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            font-size: 10px;
            flex-shrink: 0;
        }
        .panel-tabs .tab {
            padding: 4px 12px;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.1s;
        }
        .panel-tabs .tab.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent);
        }
        .panel-tabs .tab:hover:not(.active) {
            background: #2d2d30;
        }
        #project-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            font-size: 11px;
            background: var(--bg-panel);
        }
        #project-panel .folder {
            padding: 2px 8px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            border-left: 2px solid transparent;
        }
        #project-panel .folder:hover {
            background: #2d2d30;
        }
        #project-panel .folder .icon {
            color: #d4a017;
        }
        #project-panel .file {
            padding: 2px 8px 2px 22px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
        }
        #project-panel .file:hover {
            background: #2d2d30;
        }
        #project-panel .file .icon {
            font-size: 12px;
            color: var(--accent);
        }
        #project-panel .import-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 2px 8px;
            font-size: 10px;
            cursor: pointer;
            border-radius: 3px;
            margin: 4px 2px;
            width: calc(100% - 4px);
            text-align: center;
        }
        #project-panel .import-btn:hover {
            background: var(--accent-hover);
        }
        #info-panel {
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            padding: 4px 8px;
            font-size: 10px;
            color: var(--text-dim);
            background: var(--bg-panel);
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-height: 50px;
        }
        #info-panel .label {
            color: var(--text-secondary);
            font-weight: 500;
        }
        #info-panel .value {
            color: var(--text-primary);
        }
        /* ============================================
           CENTER VIEWPORT
           ============================================ */
        #center-viewport {
            grid-area: center;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            min-width: 0;
            min-height: 0;
        }
        #viewport-toolbar {
            display: flex;
            align-items: center;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 2px 8px;
            gap: 4px;
            flex-shrink: 0;
            height: 22px;
            font-size: 10px;
        }
        #viewport-toolbar .tool {
            padding: 1px 8px;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 3px;
            font-size: 11px;
        }
        #viewport-toolbar .tool:hover {
            background: #2d2d30;
            color: var(--text-primary);
        }
        #viewport-toolbar .tool.active {
            background: var(--accent);
            color: #fff;
        }
        #viewport-toolbar .sep {
            width: 1px;
            height: 14px;
            background: var(--border);
            margin: 0 6px;
        }
        #viewport-toolbar .zoom-indicator {
            color: var(--text-secondary);
            margin-left: 8px;
            font-size: 10px;
        }
        #viewport-canvas-container {
            flex: 1;
            overflow: hidden;
            position: relative;
            background: #1e1e1e;
            cursor: default;
        }
        #viewport-canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* ============================================
           RIGHT PANEL (Effects & Align)
           ============================================ */
        #right-panel {
            grid-area: right;
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            min-width: 0;
        }
        #right-panel .section {
            border-bottom: 1px solid var(--border);
            padding: 4px 8px;
        }
        #right-panel .section-title {
            font-size: 10px;
            color: var(--text-secondary);
            font-weight: 600;
            padding: 3px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #right-panel .section-title .arrow {
            color: var(--text-dim);
            font-size: 8px;
        }
        #right-panel .section-title:hover {
            color: var(--text-primary);
        }
        #effects-panel .effect-item {
            padding: 3px 4px;
            font-size: 10px;
            color: var(--text-dim);
            border-radius: 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #effects-panel .effect-item:hover {
            background: #2d2d30;
            color: var(--text-secondary);
        }
        #effects-panel .effect-item .icon {
            font-size: 14px;
            opacity: 0.6;
        }
        #align-panel .align-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
        }
        #align-panel .align-buttons button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 2px 6px;
            font-size: 9px;
            cursor: pointer;
            border-radius: 2px;
            font-family: var(--font-ui);
        }
        #align-panel .align-buttons button:hover {
            background: #2d2d30;
            border-color: var(--border-light);
        }
        /* ============================================
           TIMELINE PANEL (Bottom)
           ============================================ */
        #timeline-panel {
            grid-area: timeline;
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            display: grid;
            grid-template-columns: 180px 1fr;
            grid-template-rows: 28px 1fr;
            grid-template-areas:
                "tl-controls tl-controls"
                "tl-stack tl-tracks";
            height: 180px;
            min-height: 120px;
            resize: vertical;
            overflow: hidden;
        }
        #timeline-controls {
            grid-area: tl-controls;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 6px;
            gap: 2px;
            height: 28px;
            flex-shrink: 0;
        }
        #timeline-controls .play-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 3px;
            font-family: var(--font-ui);
            transition: all 0.08s;
        }
        #timeline-controls .play-btn:hover {
            background: #2d2d30;
            color: var(--text-primary);
        }
        #timeline-controls .play-btn.active {
            color: var(--accent);
        }
        #timeline-controls .time-display {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-primary);
            background: var(--bg-input);
            padding: 1px 6px;
            border-radius: 2px;
            margin-left: 4px;
            min-width: 50px;
            text-align: center;
        }
        #timeline-controls .transport-label {
            color: var(--text-dim);
            font-size: 9px;
            margin-left: 2px;
        }
        #timeline-controls .loop-toggle {
            padding: 2px 8px;
            font-size: 12px;
            cursor: pointer;
            color: var(--text-dim);
            border-radius: 3px;
        }
        #timeline-controls .loop-toggle:hover {
            background: #2d2d30;
            color: var(--text-secondary);
        }
        #timeline-controls .loop-toggle.on {
            color: var(--accent);
        }
        #timeline-controls .export-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 2px 8px;
            font-size: 10px;
            cursor: pointer;
            border-radius: 3px;
            margin-left: 4px;
        }
        #timeline-controls .export-btn:hover {
            background: var(--accent-hover);
        }
        #timeline-controls .timeline-zoom {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: 9px;
            color: var(--text-dim);
        }
        #timeline-controls .timeline-zoom input[type="range"] {
            width: 60px;
            height: 4px;
            -webkit-appearance: none;
            background: var(--border);
            border-radius: 2px;
            outline: none;
        }
        #timeline-controls .timeline-zoom input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }
        #layer-stack {
            grid-area: tl-stack;
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            overflow-x: hidden;
        }
        #layer-stack .layer-row {
            display: flex;
            align-items: center;
            padding: 1px 4px;
            height: 22px;
            font-size: 10px;
            border-bottom: 1px solid var(--border);
            gap: 2px;
            cursor: pointer;
            background: var(--track-odd);
            transition: background 0.05s;
        }
        #layer-stack .layer-row:nth-child(even) {
            background: var(--track-even);
        }
        #layer-stack .layer-row.selected {
            background: #38383a;
            border-left: 3px solid var(--accent);
        }
        #layer-stack .layer-row .vis-toggle,
        #layer-stack .layer-row .audio-toggle,
        #layer-stack .layer-row .solo-toggle,
        #layer-stack .layer-row .lock-toggle {
            width: 16px;
            text-align: center;
            font-size: 10px;
            color: var(--text-dim);
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.1s;
        }
        #layer-stack .layer-row .vis-toggle.on,
        #layer-stack .layer-row .audio-toggle.on,
        #layer-stack .layer-row .solo-toggle.on {
            opacity: 1;
            color: var(--text-secondary);
        }
        #layer-stack .layer-row .lock-toggle.on {
            opacity: 1;
            color: var(--warning);
        }
        #layer-stack .layer-row .layer-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-left: 4px;
            color: var(--text-primary);
            font-weight: 400;
        }
        #layer-stack .layer-row .layer-type-badge {
            font-size: 8px;
            padding: 0 4px;
            border-radius: 2px;
            color: var(--text-dim);
            background: var(--border);
        }
        #timeline-tracks-area {
            grid-area: tl-tracks;
            background: var(--bg-panel);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        #timeline-ruler {
            height: 22px;
            background: var(--ruler-bg);
            border-bottom: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        #timeline-ruler canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #timeline-body {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg-panel);
        }
        #timeline-body canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        #timeline-body .playhead-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--playhead);
            pointer-events: none;
            z-index: 20;
            will-change: transform;
            transform: translateX(0);
            box-shadow: 0 0 4px var(--playhead);
        }
        /* ============================================
           LAYER PROPERTIES PANEL (Contextual)
           ============================================ */
        #layer-properties {
            background: var(--bg-panel);
            border-top: 1px solid var(--border);
            padding: 4px 8px;
            display: none;
            flex-direction: column;
            gap: 2px;
            font-size: 10px;
            max-height: 120px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        #layer-properties.visible {
            display: flex;
        }
        #layer-properties .prop-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 1px 0;
        }
        #layer-properties .prop-row .prop-label {
            color: var(--text-secondary);
            width: 52px;
            font-size: 10px;
            font-family: var(--font-mono);
        }
        #layer-properties .prop-row .prop-value {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 1px 4px;
            border-radius: 2px;
            width: 48px;
            font-size: 10px;
            font-family: var(--font-mono);
            text-align: right;
        }
        #layer-properties .prop-row .prop-value:focus {
            border-color: var(--accent);
            outline: none;
        }
        #layer-properties .prop-row .stopwatch {
            width: 16px;
            height: 16px;
            cursor: pointer;
            border-radius: 50%;
            background: transparent;
            border: 1px solid var(--border);
            font-size: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            transition: all 0.1s;
        }
        #layer-properties .prop-row .stopwatch.on {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        #layer-properties .prop-row .stopwatch:hover {
            background: #2d2d30;
        }
        #layer-properties .prop-row .keyframe-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--keyframe);
            opacity: 0;
            transition: opacity 0.1s;
        }
        #layer-properties .prop-row .keyframe-dot.visible {
            opacity: 1;
        }
        #layer-properties .prop-row .lock-dim {
            font-size: 9px;
            color: var(--text-dim);
            cursor: pointer;
        }
        /* ============================================
           RESPONSIVE & UTILITY
           ============================================ */
        .hidden {
            display: none !important;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .text-ellipsis {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        /* ============================================
           CANVAS CURSOR OVERRIDES
           ============================================ */
        #viewport-canvas-container.dragging {
            cursor: grabbing;
        }
        #viewport-canvas-container.panning {
            cursor: grab;
        }
        #viewport-canvas-container .crosshair {
            cursor: crosshair;
        }
        /* resize handle for timeline */
        #timeline-panel .resize-handle {
            position: absolute;
            top: -3px;
            left: 0;
            right: 0;
            height: 6px;
            cursor: ns-resize;
            z-index: 10;
            background: transparent;
        }
        /* scrollbar overrides */
        #layer-stack::-webkit-scrollbar,
        #project-panel::-webkit-scrollbar,
        #right-panel::-webkit-scrollbar {
            width: 6px;
        }
        #layer-stack::-webkit-scrollbar-track,
        #project-panel::-webkit-scrollbar-track,
        #right-panel::-webkit-scrollbar-track {
            background: var(--scroll-bg);
        }
        #layer-stack::-webkit-scrollbar-thumb,
        #project-panel::-webkit-scrollbar-thumb,
        #right-panel::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        /* hidden file input */
        #import-media {
            display: none;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- ===== TOP MENU ===== -->
        <header id="top-menu">
            <div class="logo">Sysbin <span>动画编辑器</span></div>
            <nav class="menu-items">
                <span class="mi">文件</span><span class="mi">编辑</span><span class="mi">合成</span>
                <span class="mi">图层</span><span class="mi">效果</span><span class="mi">动画</span>
                <span class="mi">视图</span><span class="mi">窗口</span><span class="mi">帮助</span>
            </nav>
            <div class="workspace-info">未命名合成 • 1920×1080 • 30fps</div>
        </header>

        <!-- ===== LEFT PANEL ===== -->
        <aside id="left-panel">
            <div class="panel-tabs">
                <span class="tab active">项目</span>
                <span class="tab">信息</span>
            </div>
            <div id="project-panel">
                <button class="import-btn" id="import-btn">📥 导入媒体</button>
                <div class="folder"><span class="icon">📁</span> 合成</div>
                <div class="file"><span class="icon">🎬</span> 合成 1</div>
                <div class="folder"><span class="icon">📁</span> 素材</div>
                <div class="file"><span class="icon">🖼️</span> background.png</div>
                <div class="file"><span class="icon">🖼️</span> logo.svg</div>
                <div class="folder"><span class="icon">📁</span> 输出</div>
                <div style="padding:8px 4px;color:var(--text-dim);font-size:9px;">▲ 将素材拖入时间轴</div>
            </div>
            <div id="info-panel">
                <div><span class="label">分辨率:</span> <span class="value">1920 × 1080</span></div>
                <div><span class="label">帧率:</span> <span class="value">30 fps</span></div>
                <div><span class="label">时长:</span> <span class="value">00:00:10</span></div>
                <div><span class="label">光标位置:</span> <span class="value" id="cursor-coords">0, 0</span></div>
            </div>
        </aside>

        <!-- ===== CENTER VIEWPORT ===== -->
        <main id="center-viewport">
            <div id="viewport-toolbar">
                <span class="tool active">◀</span><span class="tool">▶</span>
                <span class="sep"></span>
                <span class="tool">⛶</span><span class="tool">⊞</span><span class="tool">⤡</span>
                <span class="sep"></span>
                <span class="tool">🔍</span>
                <span class="zoom-indicator" id="zoom-indicator">100%</span>
                <span style="margin-left:auto;color:var(--text-dim);font-size:9px;">合成: 合成 1</span>
            </div>
            <div id="viewport-canvas-container">
                <canvas id="comp-canvas"></canvas>
            </div>
            <!-- Layer properties will appear below viewport when a layer is selected -->
            <div id="layer-properties" class="visible">
                <!-- populated dynamically -->
            </div>
        </main>

        <!-- ===== RIGHT PANEL ===== -->
        <aside id="right-panel">
            <div class="section" id="effects-section">
                <div class="section-title"><span class="arrow">▼</span> 效果 & 预设</div>
                <div class="effect-item"><span class="icon">▣</span> 模糊</div>
                <div class="effect-item"><span class="icon">◑</span> 投影</div>
                <div class="effect-item"><span class="icon">◈</span> 发光</div>
                <div class="effect-item"><span class="icon">▤</span> 渐变</div>

        <!-- ===== TIMELINE ===== -->
